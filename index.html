<!DOCTYPE html>
<html>
  <head>
    <title>My map game </title>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
  </head>

  <body>
   <img
      src="Glossy Blue and Purple HecTrek Logo.png"
      alt="Hectrek"
     class="hectrek-logo"
    >   
    <p class="square-count">
      Squares collected:<span id="squareCount"> 0</span>
    </p>

    <div id="map"></div>

  <p class="tracking-status">
         Tracking: <span id="trackingStatus">Off</span>
      </p>
 
     <!-- <button id="testLocationButton">Test location</button>
     -->
     <div class="button-group">
  <button id="startWalkButton">Start walk</button>
  <button id="stopWalkButton">Stop walk</button>
  <button id="recentreButton">Recentre</button>
</div>

<div class="button-group">
  <button id="drawBoundaryButton">Draw boundary</button>
  <button id="finishBoundaryButton">Finish boundary</button>
</div>

<div class="button-group reset-group">
  <button id="resetButton">Reset progress</button>
  <button id="resetAreasButton">Delete all areas</button>
</div>

 
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 

<div id="hectorMessage"></div>

<img
  src="hector-curled.png"
  alt="Hector the hedgehog"
  id="hector"
>

    <script src="script.js"></script>

  </body>

  </html>
